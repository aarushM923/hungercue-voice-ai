# Continuous integration for HungerCue v2.
#
# tests       - every push and pull request: the full pytest suite. Needs no API
#               keys; every external service (Twilio, OpenAI, Deepgram, Google) is faked.
# smoke-eval  - every pull request: 20 simulated calls through the real pipeline
#               (real Deepgram + OpenAI, no phone calls, no texts). Fails the build if
#               slot accuracy or latency regresses past evals/baseline-smoke.json.
#               Needs repository secrets OPENAI_API_KEY and DEEPGRAM_API_KEY; without
#               them it is skipped (and says so) instead of failing. Costs roughly
#               $1-3 of API usage per run.
#
# Nothing here deploys anything.

name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  smoke-eval:
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check for API key secrets
        id: keys
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$DEEPGRAM_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Smoke eval skipped: add OPENAI_API_KEY and DEEPGRAM_API_KEY as repository secrets to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keys.outputs.present == 'true'
        run: pip install -r requirements-dev.txt
      - name: Run 20-call smoke suite and compare with baseline
        if: steps.keys.outputs.present == 'true'
        run: python -m evals.run --suite smoke --concurrency 5 --out evals/results/ci-smoke --check-baseline
      - name: Upload eval report
        if: always() && steps.keys.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-report
          path: evals/results/ci-smoke/
