[project]
name = "hungercue"
version = "2.0.0"
description = "Real-time phone agent that books food-rescue pickups"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["hungercue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" lets us write `async def test_...` without decorating each test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
